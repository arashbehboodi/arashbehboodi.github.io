---
layout: default
---
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><small>Published on {{ page.date | date: "%B %d, %Y" }}</small></p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
